name: ci
on: [push, pull_request]
jobs:
  host-tests:
    # No GPU on hosted runners: the harness tests and the CPU-reference path run here;
    # GPU campaigns are run on a CUDA machine and recorded in results/README.md.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest && pip install -e .
      - run: python -m cudiff configs
      - run: python -m pytest -q
